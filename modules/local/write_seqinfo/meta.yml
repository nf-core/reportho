# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "WRITE_SEQINFO"
description: write seqinfo for the reportho pipeline
keywords:
  - reportho
  - write
  - seqinfo
tools: []
input:
  - uniprot_id:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), val(uniprot_id)"
  - offline_run:
      type: value
      description: "Nextflow input declaration: val offline_run"
output:
  - seqinfo:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_exact.txt":
          type: file
          description: 'Output file emitted by this process: tuple val(meta), path("*_id.txt"), path("*_taxid.txt"), path("*_exact.txt") , emit: seqinfo'
          pattern: "*_exact.txt"
  - versions:
      - versions.yml:
          type: file
          description: 'Output file emitted by this process: path "versions.yml"                                                         , emit: versions'
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
