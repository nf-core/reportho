# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: fetch_oma_group_online
description: Fetch OMA ortholog group members from the online OMA API
keywords:
  - oma
  - orthology
  - uniprot
  - api
tools:
  - python:
      description: Python is a programming language that lets you work quickly and integrate systems more effectively.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
  - biopython:
      description: Biopython is a set of freely available tools for biological computation.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      doi: 10.1093/bioinformatics/btp163
      licence: ["Biopython"]
  - requests:
      description: Requests is a simple, yet elegant, HTTP library.
      homepage: https://requests.readthedocs.io/
      documentation: https://requests.readthedocs.io/
      licence: ["Apache-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata
    - uniprot_id:
        type: file
        description: File containing the UniProt identifier used as query
    - taxid:
        type: file
        description: File containing taxonomy identifier associated with the query
    - exact:
        type: file
        description: File indicating whether the ID was found through exact match
output:
  oma_group:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*_oma_group.csv":
          type: file
          description: CSV file listing retrieved OMA ortholog group members
          pattern: "*_oma_group.csv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
    - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopython:
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c \"import Bio; print(Bio.__version__)\" | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_requests:
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
    - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_oma_database:
    - - ${task.process}:
          type: string
          description: The name of the process
      - oma_database:
          type: string
          description: The name of the resource
    - "get_oma_version.py | sed -n 's/^[[:space:]]*OMA Database:[[:space:]]*//p'":
          type: eval
          description: The expression to obtain the OMA database version
  versions_oma_api:
    - - ${task.process}:
          type: string
          description: The name of the process
      - oma_api:
          type: string
          description: The name of the resource
    - "get_oma_version.py | sed -n 's/^[[:space:]]*OMA API:[[:space:]]*//p'":
          type: eval
          description: The expression to obtain the OMA API version
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
    - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c \"import Bio; print(Bio.__version__)\" | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
    - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - oma_database:
          type: string
          description: The name of the resource
    - "get_oma_version.py | sed -n 's/^[[:space:]]*OMA Database:[[:space:]]*//p'":
          type: eval
          description: The expression to obtain the OMA database version
    - - ${task.process}:
          type: string
          description: The name of the process
      - oma_api:
          type: string
          description: The name of the resource
    - "get_oma_version.py | sed -n 's/^[[:space:]]*OMA API:[[:space:]]*//p'":
          type: eval
          description: The expression to obtain the OMA API version
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
