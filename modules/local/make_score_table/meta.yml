# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: make_score_table
description: Compute ortholog support scores from merged group assignments
keywords:
  - score
  - table
  - orthologs
  - scoring
tools:
  - python:
      description: Python is a programming language that lets you work quickly and integrate systems more effectively.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
  - biopython:
      description: Biopython is a set of freely available tools for biological computation.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      doi: 10.1093/bioinformatics/btp163
      licence: ["Biopython"]
  - requests:
      description: Requests is a simple, yet elegant, HTTP library.
      homepage: https://requests.readthedocs.io/
      documentation: https://requests.readthedocs.io/
      licence: ["Apache-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata
    - merged_csv:
        type: file
        description: Merged CSV file containing ortholog group assignments
    - id_map:
        type: file
        description: Optional ID mapping file used to remap identifiers before scoring
        optional: true
output:
  score_table:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*_score_table.csv":
          type: file
          description: CSV table containing computed ortholog support scores
          pattern: "*_score_table.csv"
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions used in the module
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
