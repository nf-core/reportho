# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "MAKE_STATS"
description: make stats for the reportho pipeline
keywords:
  - reportho
  - make
  - stats
tools: []
input:
  - score_table:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(score_table)"
output:
  - stats:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_stats.yml":
          type: file
          description: "Output file emitted by this process: tuple val(meta), path(\"*_stats.yml\"), emit: stats"
          pattern: "*_stats.yml"
  - versions:
      - versions.yml:
          type: file
          description: "Output file emitted by this process: path \"versions.yml\"                 , emit: versions"
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
