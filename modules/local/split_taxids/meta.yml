# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "SPLIT_TAXIDS"
description: split taxids for the reportho pipeline
keywords:
  - reportho
  - split
  - taxids
tools: []
input:
  - input_file:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(input_file)"
output:
  - fastas:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*.fa":
          type: file
          description: "Output file emitted by this process: tuple val(meta), path(\"*.fa\"), emit: fastas"
          pattern: "*.fa"
  - versions:
      - versions.yml:
          type: file
          description: "Output file emitted by this process: path \"versions.yml\"          , emit: versions"
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
