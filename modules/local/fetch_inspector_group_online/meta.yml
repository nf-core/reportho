# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: fetch_inspector_group_online
description: Fetch OrthoInspector ortholog group members from the online service
keywords:
  - orthoinspector
  - orthology
  - uniprot
  - api
tools:
  - python:
      description: Python is a programming language that lets you work quickly and integrate systems more effectively.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
  - biopython:
      description: Biopython is a set of freely available tools for biological computation.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      doi: 10.1093/bioinformatics/btp163
      licence: ["Biopython"]
  - requests:
      description: Requests is a simple, yet elegant, HTTP library.
      homepage: https://requests.readthedocs.io/
      documentation: https://requests.readthedocs.io/
      licence: ["Apache-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata
    - uniprot_id:
        type: file
        description: File containing the UniProt identifier used as query
    - taxid:
        type: file
        description: File containing taxonomy identifier associated with the query
    - exact:
        type: file
        description: File indicating whether the ID was found through exact match
  - inspector_version:
      type: string
      description: OrthoInspector database version identifier to query
output:
  inspector_group:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*_inspector_group.csv":
          type: file
          description: CSV file listing retrieved OrthoInspector ortholog group members
          pattern: "*_inspector_group.csv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
    - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopython:
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c \"import Bio; print(Bio.__version__)\" | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_requests:
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
    - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_orthoinspector_database:
    - - ${task.process}:
          type: string
          description: The name of the process
      - orthoinspector_database:
          type: string
          description: The name of the tool
    - "echo \"$inspector_version\" | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the database used
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
    - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c \"import Bio; print(Bio.__version__)\" | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
    - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - orthoinspector_database:
          type: string
          description: The name of the tool
    - "echo \"$inspector_version\" | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the database used
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
