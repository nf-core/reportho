# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "FETCH_UNIPROT_SEQUENCES"
description: fetch uniprot sequences for the reportho pipeline
keywords:
  - reportho
  - fetch
  - uniprot
  - sequences
tools: []
input:
  - ids:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(ids), path(query_fasta)"
output:
  - fasta:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_uniprot_sequences.fa":
          type: file
          description: 'Output file emitted by this process: tuple val(meta), path("*_uniprot_sequences.fa")  , emit: fasta'
          pattern: "*_uniprot_sequences.fa"
  - hits:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_uniprot_seq_hits.txt":
          type: file
          description: 'Output file emitted by this process: tuple val(meta), path("*_uniprot_seq_hits.txt")  , emit: hits'
          pattern: "*_uniprot_seq_hits.txt"
  - misses:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_uniprot_seq_misses.txt":
          type: file
          description: 'Output file emitted by this process: tuple val(meta), path("*_uniprot_seq_misses.txt"), emit: misses'
          pattern: "*_uniprot_seq_misses.txt"
  - versions:
      - versions.yml:
          type: file
          description: 'Output file emitted by this process: path "versions.yml"                              , emit: versions'
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
