# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "FETCH_OMA_GROUP_LOCAL"
description: fetch oma group local for the reportho pipeline
keywords:
  - reportho
  - fetch
  - oma
  - group
  - local
tools: []
input:
  - uniprot_id:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(uniprot_id), path(taxid), path(exact)"
  - db:
      type: file
      description: "Nextflow input declaration: path db"
      pattern: "*"
  - uniprot_idmap:
      type: file
      description: "Nextflow input declaration: path uniprot_idmap"
      pattern: "*"
  - ensembl_idmap:
      type: file
      description: "Nextflow input declaration: path ensembl_idmap"
      pattern: "*"
  - refseq_idmap:
      type: file
      description: "Nextflow input declaration: path refseq_idmap"
      pattern: "*"
output:
  - oma_group:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_oma_group.csv":
          type: file
          description: "Output file emitted by this process: tuple val(meta), path(\"*_oma_group.csv\"), emit: oma_group"
          pattern: "*_oma_group.csv"
  - versions:
      - versions.yml:
          type: file
          description: "Output file emitted by this process: path \"versions.yml\"                     , emit: versions"
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
