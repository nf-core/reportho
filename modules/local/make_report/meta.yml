# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "MAKE_REPORT"
description: make report for the reportho pipeline
keywords:
  - reportho
  - make
  - report
tools: []
input:
  - id:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(id), path(taxid), path(exact), path(score_table), path(filtered_hits), path(support_plot), path(venn_plot), path(jaccard_plot), path(orthostats), path(seq_hits), path(seq_misses), path(merge_stats), path(clusters), path(params_file)"
output:
  - report_files:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "${prefix}/*":
          type: file
          description: 'Output file emitted by this process: tuple val(meta), path("${prefix}/*"), emit: report_files'
          pattern: "${prefix}/*"
  - versions:
      - versions.yml:
          type: file
          description: 'Output file emitted by this process: path "versions.yml"                 , emit: versions'
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
