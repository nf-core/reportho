# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "STATS2CSV"
description: stats2csv for the reportho pipeline
keywords:
  - reportho
  - stats2csv
tools: []
input:
  - stats:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(stats)"
output:
  - csv:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_stats.csv":
          type: file
          description: 'Output file emitted by this process: tuple val(meta), path("*_stats.csv"), emit: csv'
          pattern: "*_stats.csv"
  - versions:
      - versions.yml:
          type: file
          description: 'Output file emitted by this process: path "versions.yml"                 , emit: versions'
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
