# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: identify_seq_online
description: Identify query sequence metadata using online OMA sequence search services
keywords:
  - identify
  - sequence-search
  - oma
  - api
tools:
  - python:
      description: Python is a programming language that lets you work quickly and integrate systems more effectively.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
  - biopython:
      description: Biopython is a set of freely available tools for biological computation.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      doi: 10.1093/bioinformatics/btp163
      licence: ["Biopython"]
  - requests:
      description: Requests is a simple, yet elegant, HTTP library.
      homepage: https://requests.readthedocs.io/
      documentation: https://requests.readthedocs.io/
      licence: ["Apache-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata
    - fasta:
        type: file
        description: Input FASTA file containing query sequence(s) for online identification
output:
  seqinfo:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*_id.txt":
          type: file
          description: File containing the identified UniProt query identifier
          pattern: "*_id.txt"
      - "*_taxid.txt":
          type: file
          description: File containing taxonomy identifier for the identified sequence
          pattern: "*_taxid.txt"
      - "*_exact.txt":
          type: file
          description: File indicating whether sequence identification was exact
          pattern: "*_exact.txt"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopython:
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c 'import Bio; print(Bio.__version__)' | sed 's/^//'":
        type: eval
        description: The expression to obtain the version of the tool
  versions_requests:
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
      - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c 'import Bio; print(Bio.__version__)' | sed 's/^//'":
        type: eval
        description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
      - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
