# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: dump_params
description: Serialize pipeline parameters to a YAML configuration file
keywords:
  - parameters
  - configuration
  - yaml
  - serialization
tools:
  - coreutils:
      description: |
        GNU Coreutils is a package of GNU utilities designed for basic file, shell and text manipulation.
      homepage: https://www.gnu.org/software/coreutils/
      documentation: https://www.gnu.org/software/coreutils/manual/coreutils.html
      licence: ["GPL-3.0-or-later"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata
    - exact:
        type: file
        description: File containing exact match parameter value
  - use_centroid:
      type: boolean
      description: Whether to use centroid approach
  - min_score:
      type: integer
      description: Minimum score threshold for filtering
  - skip_merge:
      type: boolean
      description: Whether to skip merge step
  - min_identity:
      type: float
      description: Minimum identity threshold (0-1)
  - min_coverage:
      type: float
      description: Minimum coverage threshold (0-1)
output:
  params:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "params.yml":
          type: file
          description: YAML file containing serialized pipeline parameters
          pattern: "params.yml"
  versions:
    - - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
