# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: fetch_refseq_sequences
description: Fetch RefSeq protein sequences for mapped ortholog identifiers
keywords:
  - refseq
  - sequences
  - orthologs
  - uniprot
tools:
  - python:
      description: Python is a programming language that lets you work quickly and integrate systems more effectively.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/3/
      licence: ["PSF-2.0"]
  - biopython:
      description: Biopython is a set of freely available tools for biological computation.
      homepage: https://biopython.org/
      documentation: https://biopython.org/wiki/Documentation
      doi: 10.1093/bioinformatics/btp163
      licence: ["Biopython"]
  - requests:
      description: Requests is a simple, yet elegant, HTTP library.
      homepage: https://requests.readthedocs.io/
      documentation: https://requests.readthedocs.io/
      licence: ["Apache-2.0"]
input:
  - - meta:
        type: map
        description: Groovy Map containing sample metadata
    - ids:
        type: file
        description: File containing query identifiers to fetch RefSeq sequences for
    - query_fasta:
        type: file
        description: Optional FASTA file of input query sequences
        optional: true
output:
  fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*_refseq_sequences.fa":
          type: file
          description: FASTA file containing RefSeq-derived ortholog sequences
          pattern: "*_refseq_sequences.fa"
  hits:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*_refseq_seq_hits.txt":
          type: file
          description: Text file listing query identifiers successfully mapped to RefSeq sequences
          pattern: "*_refseq_seq_hits.txt"
  misses:
    - - meta:
          type: map
          description: Groovy Map containing sample metadata
      - "*_refseq_seq_misses.txt":
          type: file
          description: Text file listing query identifiers that could not be mapped to RefSeq sequences
          pattern: "*_refseq_seq_misses.txt"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_biopython:
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c 'import Bio; print(Bio.__version__)' | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_requests:
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
      - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - "python --version | sed 's/Python //'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - biopython:
          type: string
          description: The name of the tool
    - "python -c 'import Bio; print(Bio.__version__)' | sed 's/^//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - requests:
          type: string
          description: The name of the tool
      - "pip show requests | sed -n 's/^Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
