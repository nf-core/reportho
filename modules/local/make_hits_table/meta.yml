# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "MAKE_HITS_TABLE"
description: make hits table for the reportho pipeline
keywords:
  - reportho
  - make
  - hits
  - table
tools: []
input:
  - merged_csv:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(merged_csv)"
output:
  - hits_table:
      type: tuple
      description: "Nextflow output declaration: tuple val(meta), path('*hits_table.csv'), emit: hits_table"
  - versions:
      - versions.yml:
          type: file
          description: 'Output file emitted by this process: path "versions.yml"                     , emit: versions'
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
