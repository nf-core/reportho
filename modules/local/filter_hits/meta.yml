# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "FILTER_HITS"
description: filter hits for the reportho pipeline
keywords:
  - reportho
  - filter
  - hits
tools: []
input:
  - score_table:
      type: tuple
      description: "Nextflow input declaration: tuple val(meta), path(score_table), path(queryid)"
  - use_centroid:
      type: value
      description: "Nextflow input declaration: val use_centroid"
  - min_score:
      type: value
      description: "Nextflow input declaration: val min_score"
output:
  - scored_hits:
      - meta:
          type: map
          description: "Groovy map with sample metadata propagated from input"
      - "*_centroid.txt":
          type: file
          description: "Output file emitted by this process: tuple val(meta), path('*_minscore_*.txt'), path(\"*_centroid.txt\"), emit: scored_hits"
          pattern: "*_centroid.txt"
  - filtered_hits:
      type: tuple
      description: "Nextflow output declaration: tuple val(meta), path('*_filtered_hits.txt')                     , emit: filtered_hits"
  - versions:
      - versions.yml:
          type: file
          description: "Output file emitted by this process: path \"versions.yml\"                                              , emit: versions"
          pattern: "versions.yml"
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
