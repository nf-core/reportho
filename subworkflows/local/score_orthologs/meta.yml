# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "SCORE_ORTHOLOGS"
description: Score ortholog candidates, filter results, and generate per-query and aggregated summary tables
keywords:
  - reportho
  - score
  - orthologs
  - statistics
components:
  - FILTER_HITS
  - MAKE_HITS_TABLE
  - MAKE_MERGE_TABLE
  - MAKE_SCORE_TABLE
  - MAKE_STATS
  - MERGE_HITS
  - MERGE_MERGE
  - MERGE_STATS
  - PLOT_ORTHOLOGS
  - STATS2CSV
input:
  - ch_query:
      type: channel
      description: Per-query sequence metadata used for filtering and plotting context
  - ch_orthologs:
      type: channel
      description: Per-query ortholog assignments to score
  - ch_id_map:
      type: channel
      description: Per-query ID mapping tables used during score computation
  - ch_clusters:
      type: channel
      description: Per-query cluster assignment tables used for optional merge summaries
  - skip_merge:
      type: boolean
      description: Skip ID merging related steps and emit empty placeholders for merge channels
  - skip_plots:
      type: boolean
      description: Skip plot generation and emit empty placeholders for plot channels
output:
  - score_table:
      type: channel
      description: Per-query ortholog score tables
  - orthologs:
      type: channel
      description: Per-query filtered ortholog tables after score thresholding
  - supports_plot:
      type: channel
      description: Per-query support plots, or empty placeholders when plotting is skipped
  - venn_plot:
      type: channel
      description: Per-query venn plots, or empty placeholders when plotting is skipped
  - jaccard_plot:
      type: channel
      description: Per-query jaccard plots, or empty placeholders when plotting is skipped
  - stats:
      type: channel
      description: Per-query ortholog statistics records
  - hits:
      type: channel
      description: Per-query tables listing accepted ortholog hits
  - merge:
      type: channel
      description: Per-query merge summary tables, empty when merge generation is skipped
  - aggregated_stats:
      type: channel
      description: Single aggregated statistics table across all queries
  - aggregated_hits:
      type: channel
      description: Single aggregated hits table across all queries
  - aggregated_merge:
      type: channel
      description: Single aggregated merge table across all queries, empty when merge generation is skipped
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
